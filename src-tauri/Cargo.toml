[package]
name = "foto-carnet-tauri"
version = "1.1.4"
description = "FotoCarnet — generador de carnets (Tauri)"
authors = ["Renato"]
edition = "2021"

[lib]
name = "foto_carnet_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp"] }
rayon = "1"
notify = "6"
notify-debouncer-full = "0.3"
tempfile = "3"
aes-gcm = { version = "0.11", features = ["zeroize"] }
atomic-write-file = "0.3"
keyring = { version = "4.1", default-features = false, features = ["v1"] }
zeroize = "1"
encoding_rs = "0.8.35"
semver = "1.0.28"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
